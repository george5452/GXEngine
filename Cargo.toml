[package]
name = "gxengine"
version = "0.2.0"
edition = "2024"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
eframe = { version = "=0.31.1", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
wgpu = "24"
glam = "0.29"
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
rapier3d = "0.23"
gltf = "1.4"
rfd = "0.15"
rhai = "1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
